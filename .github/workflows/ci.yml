name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend_api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: qa_interview_lab_ci
          POSTGRES_USER: qil_ci
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U qil_ci -d qa_interview_lab_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: qa_interview_lab_ci
      POSTGRES_TEST_DB: test_qa_interview_lab_ci
      POSTGRES_USER: qil_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r backend/requirements-dev.lock
      - name: Check Django, migrations and backend tests
        run: |
          # Match the credentials of the disposable service for this run.
          export POSTGRES_PASSWORD="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$DJANGO_SECRET_KEY"
          python -m pip check
          python backend/manage.py migrate --noinput
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py check
          python -m pytest -q --tb=no --show-capture=no --no-summary -o junit_logging=no -o junit_log_passing_tests=false --junitxml="$RUNNER_TEMP/qil-raw-junit.xml" > "$RUNNER_TEMP/qil-raw-test.log" 2>&1
      - &safe-junit
        name: Build safe JUnit report
        id: report
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import os
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          job = os.environ["GITHUB_JOB"]
          if job not in {"backend_api", "frontend_unit", "playwright_e2e"}:
              raise SystemExit("SAFE_JUNIT=BLOCKED unknown job")
          root = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          raw = root / "qil-raw-junit.xml"
          directory = root / "qil-safe-report"
          target = directory / "junit.xml"
          if directory.is_symlink() or target.exists() or target.is_symlink():
              raise SystemExit("SAFE_JUNIT=BLOCKED unsafe output path")
          directory.mkdir(exist_ok=True)
          if directory.resolve().parent != root:
              raise SystemExit("SAFE_JUNIT=BLOCKED output outside runner temp")

          def duration(value):
              try:
                  number = float(value)
                  return number if math.isfinite(number) and 0 <= number <= 86400 else 0.0
              except (TypeError, ValueError):
                  return 0.0

          invalid = False
          try:
              if raw.is_symlink() or not raw.is_file() or raw.stat().st_size > 20000000:
                  raise ValueError("Invalid report input")
              content = raw.read_bytes()
              if b"<!DOCTYPE" in content.upper() or b"<!ENTITY" in content.upper():
                  raise ValueError("XML declarations are forbidden")
              cases = list(ET.fromstring(content).iter("testcase"))
              if not 1 <= len(cases) <= 10000:
                  raise ValueError("Invalid test count")
              records = [(duration(case.get("time")), next((tag for tag in ("error", "failure", "skipped") if case.find(tag) is not None), None)) for case in cases]
          except (OSError, ValueError, ET.ParseError):
              invalid = True
              records = [(0.0, "error")]

          counts = {tag: sum(status == tag for _, status in records) for tag in ("failure", "error", "skipped")}
          tree = ET.Element("testsuites")
          suite = ET.SubElement(tree, "testsuite", name=job, tests=str(len(records)), failures=str(counts["failure"]), errors=str(counts["error"]), skipped=str(counts["skipped"]), time=f"{sum(seconds for seconds, _ in records):.6f}")
          for index, (seconds, status) in enumerate(records, 1):
              case = ET.SubElement(suite, "testcase", classname=job, name=f"case_{index:04d}", time=f"{seconds:.6f}")
              if status:
                  ET.SubElement(case, status, message="Report unavailable" if invalid else "Details omitted by CI privacy policy")
          ET.indent(tree)
          with target.open("xb") as stream:
              ET.ElementTree(tree).write(stream, encoding="utf-8", xml_declaration=True)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write("ready=true\n")
          print(f"SAFE_JUNIT={job} tests={len(records)} failures={counts['failure']} errors={counts['error']} skipped={counts['skipped']}")
          raise SystemExit(1 if invalid else 0)
          PY
      - &upload-junit
        name: Upload safe JUnit report
        if: ${{ always() && !cancelled() && steps.report.outputs.ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.job }}-junit
          path: ${{ runner.temp }}/qil-safe-report/junit.xml
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  frontend_unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run frontend unit tests
        run: node --test --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/qil-raw-junit.xml" "tests/**/*.test.ts" > "$RUNNER_TEMP/qil-raw-test.log" 2>&1
      - *safe-junit
      - *upload-junit

  frontend_check_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check and production build
        run: npm run build

  playwright_e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: qa_interview_lab_e2e_ci
          POSTGRES_USER: qil_e2e_ci
          POSTGRES_PASSWORD: ${{ format('ci-e2e-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U qil_e2e_ci -d qa_interview_lab_e2e_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_DB: qa_interview_lab_e2e_ci
      POSTGRES_USER: qil_e2e_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for browser tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install Playwright and headless Chromium
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m playwright install --with-deps --only-shell chromium
      - name: Run full E2E against real Django and PostgreSQL
        run: |
          export POSTGRES_PASSWORD="ci-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "::add-mask::$POSTGRES_PASSWORD"
          python frontend/tools/check_password_policy.py
          python -m pytest -c tests/e2e/pytest.ini tests/e2e -q --tb=no --show-capture=no --no-summary -o junit_logging=no -o junit_log_passing_tests=false --junitxml="$RUNNER_TEMP/qil-raw-junit.xml" > "$RUNNER_TEMP/qil-raw-test.log" 2>&1
      - *safe-junit
      - *upload-junit
