name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend_api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: qa_interview_lab_ci
          POSTGRES_USER: qil_ci
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U qil_ci -d qa_interview_lab_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: qa_interview_lab_ci
      POSTGRES_TEST_DB: test_qa_interview_lab_ci
      POSTGRES_USER: qil_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r backend/requirements-dev.lock
      - name: Check Django, migrations and backend tests
        run: |
          # Match the credentials of the disposable service for this run.
          export POSTGRES_PASSWORD="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$DJANGO_SECRET_KEY"
          python -m pip check
          python backend/manage.py migrate --noinput
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py check
          python -m pytest -q --show-capture=no --junitxml=test-results/backend.xml
      - name: Upload backend test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-report
          path: test-results/backend.xml
          if-no-files-found: warn
          retention-days: 7

  frontend_check_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check and production build
        run: npm run build

  playwright_e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for browser smoke
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.2'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install Playwright and headless Chromium
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m playwright install --with-deps --only-shell chromium
      - name: Run browser smoke against the built frontend
        run: python -m pytest -c tests/e2e/pytest.ini tests/e2e -q --junitxml=test-results/playwright.xml
      - name: Upload browser test report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-report
          path: test-results/playwright.xml
          if-no-files-found: warn
          retention-days: 7
